version: 2

models:
  - name: int_movimentacoes_uti
    description: >
      Uma linha por estadia do atendimento em uma unidade, calculada a
      partir do pareamento cronológico de eventos de entrada
      (INTERNACAO, TRANSFER. DE) e saída (TRANSFER. PARA, ALTA) do
      relatório de movimentações. eh_uti identifica estadias em unidades
      de UTI (UPPER(unidade) LIKE '%UTI%').
    columns:
      - name: atendimento
        description: Chave do atendimento, mesma da Bronze principal.
        tests:
          - not_null

      - name: data_hora_entrada
        description: Timestamp de entrada nessa unidade.
        tests:
          - not_null

      - name: data_hora_saida
        description: >
          Timestamp de saída dessa unidade. Nulo quando o atendimento
          ainda está internado (última movimentação registrada, sem
          alta ou transferência seguinte).

      - name: tipo
        description: Tipo de evento que originou a entrada nessa unidade.
        tests:
          - accepted_values:
              values: ['INTERNACAO', 'TRANSFER. DE']

      - name: eh_uti
        description: True quando a unidade contém "UTI" no nome.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - atendimento
            - data_hora_entrada