version: 2

models:
  - name: mart_uti
    description: >
      Uma linha por atendimento, agregando todas as passagens por
      unidades de UTI capturadas no relatório de movimentações.
      Consumidor direto: Estudo de correlação UTI x complexidade
      (ADR-0005). teve_uti e dias_totais_uti só refletem passagens
      dentro da janela de safras já ingeridas — atendimentos com
      jornada iniciada antes disso podem subestimar o tempo real de UTI.
    columns:
      - name: atendimento
        data_type: INT64
        description: "Chave do atendimento, mesma da Bronze principal."
        tests:
          - unique
          - not_null

      - name: teve_uti
        data_type: BOOL
        description: "True se o atendimento teve ao menos uma passagem por UTI."

      - name: dias_totais_uti
        data_type: FLOAT64
        description: "Soma de dias em unidades de UTI, somando todas as passagens."

      - name: minutos_totais_uti
        data_type: INT64
        description: "Coluna com tempo de permanência na UTI em minutos."

      - name: horas_totais_uti
        data_type: FLOAT64
        description: "Coluna com tempo de permanência na UTI em horas."

      - name: qtd_passagens_uti
        data_type: INT64
        description: "Coluna com a contagem de passagens pela UTI."